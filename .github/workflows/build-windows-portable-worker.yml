name: Build portable anaStruct worker for Windows (manual)

on:
  push:
    branches:
      - fix/v055-offline-portable-runtime-installer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-worker:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate extension Python syntax
        shell: pwsh
        run: |
          python -m compileall -q go_anastruct_2d tools
          if ($LASTEXITCODE -ne 0) { throw 'Syntax check failed' }
      - name: Build self-contained Windows worker
        shell: pwsh
        run: ./scripts/build_windows_portable.ps1
      - name: Verify self-contained worker with pinned anaStruct model
        shell: pwsh
        run: |
          python tools/smoke_portable.py
          if ($LASTEXITCODE -ne 0) { throw 'Worker numerical smoke failed' }
      - name: Numerical regression vs published v0.5.4 and v0.5.5 candidate
        shell: pwsh
        run: |
          python tools/numerical_regression.py --portable-exe dist/go_anastruct_worker/go_anastruct_worker.exe
          if ($LASTEXITCODE -ne 0) { throw 'Beam/portal numerical regression failed' }
      - name: Upload numerical regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-anastruct-v055-numerical-regression
          path: dist/numerical-regression-v055.json
          if-no-files-found: warn
      - name: Isolated clean-profile installation and corruption rejection
        shell: pwsh
        run: |
          python tools/clean_install_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Clean Windows install or checksum reject failed' }
      - name: Upload unapproved test artifact (NOT a release)
        uses: actions/upload-artifact@v4
        with:
          name: go-anastruct-windows-runtime-v055-test
          path: |
            dist/go_anastruct_2d-runtime-windows-x64-v0.5.5.zip
            dist/go_anastruct_2d-runtime-windows-x64-v0.5.5.zip.sha256
          if-no-files-found: error
