name: Sync canonical plugin source

on:
  push:
    paths:
      - ".github/workflows/sync-source.yml"
      - "dist/go_anastruct_2d-v0.5.4-plugin.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract canonical plugin
        shell: bash
        run: |
          set -euo pipefail
          expected="706f6f7654c38f84bd88bc621596f81394b26acd9063f96b52cf90d5ba52bbc6"
          actual="$(sha256sum dist/go_anastruct_2d-v0.5.4-plugin.zip | awk '{print $1}')"
          test "$actual" = "$expected"
          rm -rf go_anastruct_2d
          unzip -q dist/go_anastruct_2d-v0.5.4-plugin.zip

      - name: Commit source mirror
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- go_anastruct_2d && git diff --cached --quiet -- go_anastruct_2d; then
            echo "Source mirror is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go_anastruct_2d
          git commit -m "chore: sync canonical v0.5.4 source"
          git push
